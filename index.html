<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Engineer Application </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* MENU */
    .menu {
      height: 55px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a73e8;
    }

    .menu button {
      border: none;
      background: transparent;
      color: white;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.18);
    }

    .menu button.active {
      background: white;
      color: #1a73e8;
    }

    /* CONTENT */
    .content {
      height: calc(100vh - 55px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
	
#footer,
.wsite-footer {
    display: none !important;
}

#main {
    min-height: 100vh !important;
}

  </style>
</head>

<body>

  <div class="menu">

    <button
      class="active"
      onclick="openPage('home', this)">
      🏠 Home
    </button>

    <button
      onclick="openPage('mvs', this)">
      👨‍🔧 MVS
    </button>

    <button
      onclick="openPage('inout', this)">
      🗺️ In out
    </button>
	
	 <button
      onclick="openPage('tracker', this)">
      👨‍🔧 Tracker
    </button>

    <button
      onclick="openPage('admin', this)">
      🗺️ Admin
    </button>

  </div>

  <div class="content">

    <iframe
      id="appFrame"
      allow="geolocation; camera; microphone"
      src="https://script.google.com/macros/s/AKfycby2uLha-AAkXBoEv7QlvRugE1cRj81Uv3CBt8N4BIVzgt4SMb9zkL7noU0UjzNnebi3/exec">
    </iframe>

  </div>

  <script>

    /* GOOGLE APPS SCRIPT URLS */

    const APP_URL =
      "https://script.google.com/macros/s/AKfycby2uLha-AAkXBoEv7QlvRugE1cRj81Uv3CBt8N4BIVzgt4SMb9zkL7noU0UjzNnebi3/exec";

    const APP_URL2 =
      "https://script.google.com/macros/s/AKfycbxXA4w-zhbu8YufoxJaA1e5o8w9FoexbzCSQ-9C9x5IFQBfUGc2QxlH4vFZ0dMHqTi5/exec";

    const APP_URL3 =
      "https://script.google.com/macros/s/AKfycbx0GmXAJ5ldOp3HK9eDTyTxvKZyHud3R6wZLB6hYGphZbNWFfhOavQ3KhbIu2rk6WstXw/exec";


    /* OPEN PAGE */

    function openPage(page, button) {

      const frame =
        document.getElementById("appFrame");

      let url = APP_URL;


      /* HOME */

      if (page === "home") {
        url = APP_URL;
      }


      /* MVS */

      else if (page === "mvs") {
        url = APP_URL;
      }


      /* IN / OUT */

      else if (page === "inout") {
        url = APP_URL2;
      }


      /* TRACKER */

      else if (page === "tracker") {
        url = APP_URL3;
      }


      /* ADMIN */

      else if (page === "admin") {
        url = APP_URL3 + "?page=admin";
      }


      /* LOAD IFRAME */

      frame.src = url;


      /* ACTIVE MENU */

      document
        .querySelectorAll(".menu button")
        .forEach(function(btn) {
          btn.classList.remove("active");
        });


      button.classList.add("active");

    }
  </script>

</body>
</html>
