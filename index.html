<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Engineer Application</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* MENU */
    .menu {
      height: 55px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a73e8;
    }

    .menu button {
      border: none;
      background: transparent;
      color: white;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.18);
    }

    .menu button.active {
      background: white;
      color: #1a73e8;
    }

    /* CONTENT */
    .content {
      height: calc(100vh - 55px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <div class="menu">

    <button
      class="active"
      onclick="openPage('home', this)">
      🏠 Home
    </button>

    <button
      onclick="openPage('engineer', this)">
      👨‍🔧 Engineer
    </button>

    <button
      onclick="openPage('admin', this)">
      🗺️ Admin
    </button>

  </div>

  <div class="content">

    <iframe
      id="appFrame"
      allow="geolocation; camera; microphone"
      src="https://mithunmanna.weebly.com/">
    </iframe>

  </div>

  <script>

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzCFSk-kVz2PuRBVNk_RPzk_fNElhBmE4TzwCPJApzEPjPF7n536Ap1dIGveIYdq7oS/exec";

    function openPage(page, button) {

      const frame =
        document.getElementById("appFrame");

      let url = APP_URL;

      if (page === "home") {
        url = APP_URL;
      }

      if (page === "engineer") {
        url = APP_URL + "?page=index";
      }

      if (page === "admin") {
        url = APP_URL + "?page=admin";
      }

      frame.src = url;

      document
        .querySelectorAll(".menu button")
        .forEach(function(btn) {
          btn.classList.remove("active");
        });

      button.classList.add("active");
    }

  </script>

</body>
</html>
